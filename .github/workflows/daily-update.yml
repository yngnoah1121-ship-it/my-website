name: 毎日の価格・殿堂更新

on:
  schedule:
    - cron: "47 18 * * *"   # 日本時間 3:47
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 殿堂レギュレーションを取得
        continue-on-error: true
        run: |
          curl -sL https://dm.takaratomy.co.jp/rule/regulation/ -o /tmp/reg.html
          python3 tools/reg.py /tmp/reg.html data.json
      - name: ドラゴンスター・PAO の価格を取得（価格が古いカードから順に）
        timeout-minutes: 210
        continue-on-error: true
        env:
          PRICE_BATCH: "900"
        run: python3 tools/prices.py data.json /tmp/prices.json 2> /tmp/prices.log
      - name: 結果を確認して反映
        id: check
        run: |
          tail -5 /tmp/prices.log
          python3 - <<'PY'
          import json, sys
          s = json.load(open("/tmp/prices.json"))
          def bad_shop(shop):
              v = list(s.get(shop, {}).values()); ok = sum(x.get("st") == "ok" for x in v); err = sum(x.get("st") == "error" for x in v)
              print(shop, "取得", len(v), "価格あり", ok, "エラー", err)
              return len(v) < 50 or ok < len(v) * 0.4 or err > len(v) * 0.2
          bad = [shop for shop in ("dragonstar", "pao") if bad_shop(shop)]
          if bad:
              print("取得に失敗したので価格は更新しません:", bad); sys.exit(1)
          PY
          python3 tools/merge_prices.py data.json /tmp/prices.json
      - name: 最新の data.json に結果を適用してプッシュ
        if: always()
        run: |
          git config user.name "DUEL FORGE bot"
          git config user.email "duel-forge@users.noreply.github.com"
          # 取得中に data.json が更新されていても上書きしないよう、最新版に取得結果を当て直す
          for i in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            [ -s /tmp/reg.html ] && python3 tools/reg.py /tmp/reg.html data.json || true
            if [ -s /tmp/prices.json ] && [ "${{ steps.check.outcome }}" = "success" ]; then python3 tools/merge_prices.py data.json /tmp/prices.json; fi
            git add data.json
            git diff --cached --quiet && echo "変更なし" && exit 0
            git commit -m "毎日の価格・殿堂更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d')"
            git push && exit 0
            sleep 10
          done
          exit 1
